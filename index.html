 border-bottom:6px solid var(--cream);box-shadow:0 6px 0 var(--red)}
.hero h1{font-family:"Great Vibes","Snell Roundhand","Apple Chancery",Georgia,serif;font-weight:400;font-size:92px;line-height:1.05;margin:6px 0;text-shadow:2px 3px 0 #0009;position:relative;z-index:2}
.hrow{position:relative;z-index:2;color:#ff6f7f;letter-spacing:7px;font-size:20px;text-shadow:1px 2px 0 #0007;white-space:nowrap}
.hrow b{font-weight:400}
.fh{position:absolute;z-index:1;pointer-events:none;color:#e8394a;text-shadow:1px 1px 0 #0006}
.hero p{margin:0 auto;max-width:260px;font-size:14.5px;line-height:1.35;position:relative;z-index:2;text-shadow:1px 1px 0 #0008}
.stk{position:absolute;pointer-events:none;height:auto;width:auto;filter:drop-shadow(2px 3px 3px rgba(0,0,0,.35));z-index:3}
.card{position:relative;background:var(--cream);border-radius:18px;padding:30px 18px 34px;margin:0 0 58px;
 box-shadow:5px 6px 0 var(--red),0 0 0 3px var(--cream);border:2px dashed #a3121f55}
.card h2{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-style:italic;font-weight:600;color:var(--red);font-size:25px;margin:0 56px 16px 0;line-height:1.15}
.q{margin:0 0 18px}
.q label,.q .lb{display:block;font-weight:650;font-size:15px;margin-bottom:7px;line-height:1.3}
.q small{display:block;font-weight:400;opacity:.7;margin-top:2px}
input[type=text],input[type=date],textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:2px solid var(--wine);border-radius:12px;background:#fffdf8;color:var(--ink);outline:none}
input:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px #a3121f33}
textarea{min-height:84px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14.5px;padding:8px 13px;border-radius:999px;border:2px solid var(--wine);background:var(--chip);color:var(--wine);cursor:pointer}
.chip.on{background:var(--red);color:#fff;border-color:var(--red);font-weight:650}
.otro{margin-top:8px;font-size:15px!important;padding:9px 11px!important}
.btn{display:block;width:100%;font:inherit;font-weight:700;font-size:16.5px;padding:14px;margin-top:12px;border-radius:14px;border:2px solid var(--wine);background:var(--red);color:#fff;cursor:pointer;box-shadow:0 4px 0 var(--wine)}
.btn.alt{background:var(--chip);color:var(--wine)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wine)}
.link{background:none;border:0;color:var(--wine);text-decoration:underline;font:inherit;font-size:13px;margin:18px auto 0;display:block;opacity:.8}
.bar{position:sticky;top:0;z-index:20;height:7px;background:#fff8;margin:0 -24px}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--wine);color:#fff;padding:11px 18px;border-radius:999px;opacity:0;transition:.3s;z-index:50;font-size:14px;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>

var si=0;
function hrow(){var s=[16,22,28,34,28,22,16],o='';s.forEach(function(z,i){o+='<b style="font-size:'+z+'px;color:'+(i%2?'#ff9aa6':'#ff5568')+'">♥</b> '});return o}
function fhearts(){var o='';for(var i=0;i<26;i++){var l=(i*37)%94+1,t=(i*53)%88+3,z=11+(i*7)%20;o+='<span class="fh" style="left:'+l+'%;top:'+t+'%;font-size:'+z+'px;opacity:'+(0.35+(i%4)*0.17)+';color:'+(i%3?'#e8394a':'#f6ead4')+'">♥</span>'}return o}
function stk(style,max){
  var s=STK[si%STK.length]; si++;
  var rot=((si*37)%30)-15;
  return '<img class="stk" alt="" src="'+s+'" style="'+style+';max-width:'+max+'px;max-height:'+max+'px;transform:rotate('+rot+'deg)">';
}

function field(it){
  var h='<div class="q"><span class="lb">'+esc(it.q)+(it.note?'<small>'+esc(it.note)+'</small>':'')+'</span>';
  var v=A[it.id];
  if(it.type==="text") h+='<input type="text" data-id="'+it.id+'" placeholder="'+esc(it.ph||"Tu respuesta")+'" value="'+esc(v)+'">';
  else if(it.type==="date") h+='<input type="date" data-id="'+it.id+'" value="'+esc(v)+'">';
  else if(it.type==="textarea") h+='<textarea data-id="'+it.id+'" placeholder="Cuéntame…">'+esc(v)+'</textarea>';
  else{
    h+='<div class="chips" data-chips="'+it.id+'" data-mode="'+it.type+'">';
    it.opts.forEach(function(o){
      var on=it.type==="multi"?(v||[]).indexOf(o)>-1:v===o;
      h+='<button type="button" class="chip'+(on?' on':'')+'" data-v="'+esc(o)+'">'+esc(o)+'</button>';
    });
    h+='</div>';
    if(it.other) h+='<input type="text" class="otro" data-id="'+it.id+'_otro" placeholder="Otro…" value="'+esc(A[it.id+"_otro"])+'">';
  }
  return h+'</div>';
}

function build(){
  var h='<div class="bar"><i id="pb"></i></div>';
  h+='<header class="hero">'+
    stk('left:3%;top:10px',74)+stk('right:3%;top:8px',80)+stk('left:2%;bottom:6px',84)+stk('right:4%;bottom:4px',86)+
    fhearts()+'<div class="hrow">'+hrow()+'</div><h1>Lucas</h1><div class="hrow">'+hrow()+'</div></header>';
  SEC.forEach(function(s,i){
    h+='<section class="card">'+(i%2?stk('top:-34px;right:-16px',92)+stk('bottom:-34px;left:-18px',88):stk('top:-34px;right:-16px',90)+stk('bottom:-34px;right:-14px',86))+'<h2>'+s.t+'</h2>';
    s.items.forEach(function(it){h+=field(it)});
    h+='</section>';
  });
  h+='<section class="card">'+stk('top:-36px;left:-14px',90)+stk('bottom:-34px;right:-14px',90)+
    '<h2>¡Listo! 💌</h2><p style="margin:0 0 4px;font-size:15px;line-height:1.4">Tus respuestas se guardan solas en este teléfono. Cuando termines, descarga el Excel o envíamelas.</p>'+
    '<button class="btn" id="bx">📊 Descargar Excel</button>'+
    '<button class="btn alt" id="bw">💬 Enviar por WhatsApp</button>'+
    '<button class="btn alt" id="bc">📋 Copiar respuestas</button>'+
    '<button class="link" id="br">Borrar todo y empezar de nuevo</button></section>';
  document.getElementById("app").innerHTML=h;
  progress();
}

function rows(){
  var r=[];
  SEC.forEach(function(s){s.items.forEach(function(it){r.push([s.t.replace(/[^\p{L}\p{N} ]/gu,"").trim(),it.q,val(it)])})});
  return r;
}
function progress(){
  var n=0,t=0;SEC.forEach(function(s){s.items.forEach(function(it){t++;if(val(it))n++})});
  var b=document.getElementById("pb");if(b)b.style.width=(n/t*100)+"%";
}
function fname(){return "regalo_lucas"}

function excel(){
  var h='<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body><table border="1"><tr><th>Sección</th><th>Pregunta</th><th>Respuesta</th></tr>';
  rows().forEach(function(r){h+='<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>'});
  h+='</table></body></html>';
  var blob=new Blob(["\ufeff"+h],{type:"application/vnd.ms-excel;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname()+".xls";
  document.body.appendChild(a);a.click();a.remove();toast("Excel descargado 📊");
}
function texto(){
  var out="🎁 Cuestionario de regalo de Lucas\n",sec="";
  rows().forEach(function(r){if(r[0]!==sec){sec=r[0];out+="\n*"+sec+"*\n"}out+="• "+r[1]+": "+(r[2]||"-")+"\n"});
  return out;
}

document.addEventListener("click",function(e){
  var c=e.target.closest(".chip");
  if(c){
    var box=c.parentNode,id=box.dataset.chips,v=c.dataset.v;
    if(box.dataset.mode==="multi"){
      var a=A[id]||[],i=a.indexOf(v);if(i>-1)a.splice(i,1);else a.push(v);A[id]=a;c.classList.toggle("on");
    }else{
      if(A[id]===v){delete A[id];c.classList.remove("on")}
      else{A[id]=v;[].forEach.call(box.children,function(x){x.classList.remove("on")});c.classList.add("on")}
    }
    save();return;
  }
  var id=e.target.id;
  if(id==="bx")excel();
  if(id==="bw")window.open("https://wa.me/?text="+encodeURIComponent(texto()),"_blank");
  if(id==="bc"){var t=texto();if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast("Copiado ✅")},function(){toast("No se pudo copiar")});else toast("No se pudo copiar")}
  if(id==="br"&&confirm("¿Borrar todas las respuestas?")){A={};save();build();window.scrollTo(0,0)}
});
document.addEventListener("input",function(e){var d=e.target.dataset.id;if(d){A[d]=e.target.value;save()}});
build();
</script>
</body>
</html>
